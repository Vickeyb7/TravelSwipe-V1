<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Full bleed background for maskable and standard displays -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner glowing circle / safe area -->
  <circle cx="256" cy="256" r="180" fill="#ffffff" fill-opacity="0.08" />

  <!-- Main Luggage Container (Safe Zone within 80%) -->
  <g filter="url(#shadow)">
    <!-- Suitcase Body -->
    <rect x="156" y="176" width="200" height="236" rx="36" fill="url(#bagGrad)" stroke="#ffffff" stroke-width="4" />
    
    <!-- Luggage Telescopic Handle -->
    <path d="M206 176 V 126 C 206 112 218 100 232 100 H 280 C 294 100 306 112 306 126 V 176" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" />
    <!-- Handle grip bar -->
    <rect x="222" y="92" width="68" height="18" rx="8" fill="#1e293b" />

    <!-- Sleek Diagonal Swipe Trail (representing TripSwipe) -->
    <path d="M156 260 L 356 230" stroke="#2563eb" stroke-width="10" stroke-linecap="round" />
    <path d="M156 310 L 356 280" stroke="#0d9488" stroke-width="10" stroke-linecap="round" />

    <!-- Center Badge / Lock Accent -->
    <circle cx="256" cy="294" r="28" fill="#2563eb" />
    <path d="M246 294 L 253 301 L 268 286" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Wheels -->
    <rect x="180" y="408" width="28" height="16" rx="8" fill="#1e293b" />
    <rect x="304" y="408" width="28" height="16" rx="8" fill="#1e293b" />
  </g>
</svg>
